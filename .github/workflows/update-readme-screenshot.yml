name: Update README Screenshot

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag whose UI should be captured. Leave empty when using branch.
        required: false
        type: string
      branch:
        description: Branch to capture before a release (normally master); a changed image becomes a pull request into it. Leave empty when using tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-readme-screenshot
  cancel-in-progress: false

jobs:
  capture:
    name: Capture UI
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}
    outputs:
      label: ${{ steps.source.outputs.label }}
      commit: ${{ steps.source.outputs.commit }}
      base: ${{ steps.source.outputs.base }}
      branch_from: ${{ steps.source.outputs.branch_from }}

    steps:
      # Two sources: a published release tag (after publishing, a safety net), or a
      # branch before tagging, so the tagged README already shows the release UI.
      - name: Resolve the source to capture
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG) -eq [string]::IsNullOrWhiteSpace($env:SOURCE_BRANCH)) {
            throw 'Give exactly one of the inputs tag or branch.'
          }

          if ($env:SOURCE_BRANCH) {
            if ($env:SOURCE_BRANCH -notmatch '^[A-Za-z0-9._/-]+$') { throw "Invalid branch name '$env:SOURCE_BRANCH'." }
            $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/heads/$env:SOURCE_BRANCH" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw "Branch '$env:SOURCE_BRANCH' does not exist." }
            "label=$($env:SOURCE_BRANCH -replace '[^A-Za-z0-9.-]', '-')-$($commit.Substring(0, 7))" | Add-Content -Path $env:GITHUB_OUTPUT
            "commit=$commit" | Add-Content -Path $env:GITHUB_OUTPUT
            "base=$env:SOURCE_BRANCH" | Add-Content -Path $env:GITHUB_OUTPUT
            "branch_from=$commit" | Add-Content -Path $env:GITHUB_OUTPUT
            return
          }

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must match vMAJOR.MINOR.PATCH. Received '$env:RELEASE_TAG'."
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or [string]::IsNullOrWhiteSpace($release.published_at)) {
            throw "Release '$env:RELEASE_TAG' does not exist or is not published."
          }
          "label=$env:RELEASE_TAG" | Add-Content -Path $env:GITHUB_OUTPUT
          "commit=$env:RELEASE_TAG" | Add-Content -Path $env:GITHUB_OUTPUT
          "base=$env:DEFAULT_BRANCH" | Add-Content -Path $env:GITHUB_OUTPUT
          "branch_from=$env:DEFAULT_BRANCH" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Check out the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build screenshot generator
        shell: pwsh
        timeout-minutes: 3
        run: dotnet build tools\ServiceBusEmulatorExplorer.ReadmeScreenshot\ServiceBusEmulatorExplorer.ReadmeScreenshot.csproj --configuration Release -p:UseSharedCompilation=false -p:NodeReuse=false

      - name: Capture released application
        shell: pwsh
        timeout-minutes: 2
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "readme-screenshot\service-bus-emulator-explorer.png"
          .\scripts\Update-ReadmeScreenshot.ps1 -OutputPath $outputPath -TimeoutSeconds 120

      - name: Upload validated screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: readme-screenshot-${{ steps.source.outputs.label }}
          path: ${{ runner.temp }}\readme-screenshot\service-bus-emulator-explorer.png
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Prepare documentation branch
    needs: capture
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    env:
      LABEL: ${{ needs.capture.outputs.label }}
      BASE_BRANCH: ${{ needs.capture.outputs.base }}

    steps:
      # Branch mode builds on the exact captured commit; tag mode on the default branch.
      - name: Check out documentation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.capture.outputs.branch_from }}

      - name: Download generated screenshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: readme-screenshot-${{ env.LABEL }}
          path: generated-screenshot

      - name: Validate isolated screenshot artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath generated-screenshot -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'service-bus-emulator-explorer.png') {
            throw 'The screenshot artifact must contain exactly service-bus-emulator-explorer.png.'
          }
          if ($files[0].Length -lt 50000) {
            throw "The screenshot artifact is unexpectedly small: $($files[0].Length) bytes."
          }

          Add-Type -AssemblyName PresentationCore
          $stream = [System.IO.File]::OpenRead($files[0].FullName)
          try {
            $decoder = [System.Windows.Media.Imaging.PngBitmapDecoder]::new(
              $stream,
              [System.Windows.Media.Imaging.BitmapCreateOptions]::PreservePixelFormat,
              [System.Windows.Media.Imaging.BitmapCacheOption]::OnLoad)
            $frame = $decoder.Frames[0]
          }
          finally {
            $stream.Dispose()
          }

          $widthIsValid = $frame.PixelWidth -ge 1200 -and $frame.PixelWidth -le 2000
          $heightIsValid = $frame.PixelHeight -ge 650 -and $frame.PixelHeight -le 1000
          if (-not $widthIsValid -or -not $heightIsValid) {
            throw "The screenshot artifact has unexpected dimensions: $($frame.PixelWidth)x$($frame.PixelHeight)."
          }

      - name: Prepare branch when visuals changed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $imagePath = 'docs/images/service-bus-emulator-explorer.png'
          Copy-Item -LiteralPath 'generated-screenshot/service-bus-emulator-explorer.png' -Destination $imagePath -Force

          $imageStatus = git status --porcelain -- $imagePath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the generated README screenshot."
          }
          if ([string]::IsNullOrWhiteSpace($imageStatus)) {
            Write-Host "The captured UI matches the current README screenshot."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $imagePath
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw "The generated README screenshot failed the staged diff check."
          }

          $stagedFiles = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0 -or $stagedFiles.Count -ne 1 -or $stagedFiles[0] -ne $imagePath) {
            throw "The screenshot workflow must stage exactly $imagePath."
          }

          git commit -m "docs: refresh app screenshot for $env:LABEL"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not commit the generated README screenshot."
          }

          # scripts/Sync-ReleaseScreenshot.ps1 finds this branch by its run id and attempt suffix.
          $automationBranch = "automation/readme-screenshot-$env:LABEL-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$automationBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the generated README screenshot branch '$automationBranch'."
          }

          gh workflow run ci.yml --ref $automationBranch
          if ($LASTEXITCODE -ne 0) {
            throw "Could not dispatch fast CI for the generated README screenshot branch."
          }

          $compareUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/compare/$env:BASE_BRANCH...$automationBranch`?expand=1"
          @"
          ## README screenshot branch ready

          - Source: ``$env:LABEL``
          - Generated file: ``$imagePath``
          - Fast CI: dispatched for ``$automationBranch``
          - Next step: [open a pull request]($compareUrl)

          Branch protection intentionally requires a maintainer to open and merge the pull request.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
