name: Build and Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Fast tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Use a 1920x1080 desktop for visual baselines
        shell: pwsh
        run: |
          # Windows shrinks test windows to fit the screen; hosted runners start at 1024x768 (DEC-050).
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Desktop: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) { throw "Visual baselines need a 1920x1080 desktop; got $($bounds.Width)x$($bounds.Height)." }

      - name: Run fast tests
        shell: pwsh
        run: dotnet test ServiceBusEmulatorExplorer.slnx --configuration Release --filter "TestCategory!=Integration&TestCategory!=UiSmoke"

      - name: Upload Avalonia renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avalonia-renders-windows-fast-tests
          path: tests/ServiceBusEmulatorExplorer.Avalonia.Tests/bin/Release/net10.0/avalonia-renders/
          if-no-files-found: ignore

      - name: Verify README screenshot generation
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet build tools\ServiceBusEmulatorExplorer.ReadmeScreenshot\ServiceBusEmulatorExplorer.ReadmeScreenshot.csproj --configuration Release -p:UseSharedCompilation=false -p:NodeReuse=false
          $outputPath = Join-Path $env:RUNNER_TEMP "readme-screenshot\service-bus-emulator-explorer.png"
          .\scripts\Update-ReadmeScreenshot.ps1 -OutputPath $outputPath -TimeoutSeconds 120

  avalonia-renders:
    # DEC-058: the Avalonia spike must render the same pixels on every OS, checked against one set of baselines.
    name: Avalonia renders (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      AVALONIA_TELEMETRY_OPTOUT: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Run the Avalonia render tests
        run: dotnet test tests/ServiceBusEmulatorExplorer.Avalonia.Tests/ServiceBusEmulatorExplorer.Avalonia.Tests.csproj --configuration Release

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avalonia-renders-${{ matrix.os }}
          path: tests/ServiceBusEmulatorExplorer.Avalonia.Tests/bin/Release/net10.0/avalonia-renders/
          if-no-files-found: error
