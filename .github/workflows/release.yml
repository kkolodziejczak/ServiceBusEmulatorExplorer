name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate and draft.
        required: true
        type: string
      use_manual_launch_smoke_proof:
        description: Confirm both final EXEs passed the documented interactive Windows launch smoke because a hosted desktop session blocked it.
        required: false
        default: false
        type: boolean
      manual_launch_smoke_proof_reference:
        description: Link or identifier for the interactive proof, including both asset hashes.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Test and build unsigned assets
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Validate release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must match vMAJOR.MINOR.PATCH. Received '$tag'."
          }

          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .ref
          if ($LASTEXITCODE -ne 0 -or $tagRef -ne "refs/tags/$tag") {
            throw "Release tag '$tag' does not exist in this repository."
          }

          $version = $tag.Substring(1)
          "tag=$tag" | Add-Content -Path $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Use a 1920x1080 desktop for visual baselines
        shell: pwsh
        run: |
          # Windows shrinks test windows to fit the screen; hosted runners start at 1024x768 (DEC-050).
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Desktop: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) { throw "Visual baselines need a 1920x1080 desktop; got $($bounds.Width)x$($bounds.Height)." }

      - name: Run fast tests
        shell: pwsh
        run: dotnet test ServiceBusEmulatorExplorer.slnx --filter "TestCategory!=Integration&TestCategory!=UiSmoke"

      - name: Publish and validate release assets
        shell: pwsh
        run: |
          .\scripts\Publish-Release.ps1 -Version '${{ steps.tag.outputs.version }}' -PublishTimeoutSeconds 300
          .\scripts\Test-ReleaseArtifacts.ps1 -Version '${{ steps.tag.outputs.version }}'

      - name: Keep the unsigned assets for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release
          path: artifacts/release/${{ steps.tag.outputs.tag }}/*.exe
          if-no-files-found: error
          # Signing must be approved, and failed jobs rerun, within this window.
          retention-days: 7

  # The approval gate, SimplySign login and signing live in kkolodziejczak/gh-release-signing (DEC-059, DEC-060).
  sign:
    needs: build
    uses: kkolodziejczak/gh-release-signing/.github/workflows/sign.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      artifact: unsigned-release
      signed-artifact: signed-release

  release:
    name: Smoke-test signed assets and draft release
    needs: [build, sign]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.use_manual_launch_smoke_proof && 'manual-launch-smoke' || '' }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Use a 1920x1080 desktop for visual baselines
        shell: pwsh
        run: |
          # Windows shrinks test windows to fit the screen; hosted runners start at 1024x768 (DEC-050).
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "Desktop: $($bounds.Width)x$($bounds.Height)"
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) { throw "Visual baselines need a 1920x1080 desktop; got $($bounds.Width)x$($bounds.Height)." }

      - name: Build the UI smoke tests
        shell: pwsh
        run: dotnet build tests\ServiceBusEmulatorExplorer.UiSmoke.Tests\ServiceBusEmulatorExplorer.UiSmoke.Tests.csproj

      - name: Download the signed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-release
          path: artifacts/release/${{ needs.build.outputs.tag }}

      - name: Validate the signed assets
        shell: pwsh
        run: .\scripts\Test-ReleaseArtifacts.ps1 -Version '${{ needs.build.outputs.version }}' -ExpectedSignerThumbprint '${{ needs.sign.outputs.thumbprint }}'

      - name: Locate the signed assets
        id: publish
        shell: pwsh
        run: |
          # Test-ReleaseArtifacts proved the two names; an empty path would make the smoke test fall back to a Debug build.
          $releasePath = "artifacts\release\${{ needs.build.outputs.tag }}"
          foreach ($asset in @(@{ Output = 'runtime_required_asset'; Suffix = '-requires-dotnet10.exe' }, @{ Output = 'portable_asset'; Suffix = '-portable.exe' })) {
            $files = @(Get-ChildItem -LiteralPath $releasePath -Filter "*$($asset.Suffix)")
            if ($files.Count -ne 1) { throw "Expected one signed *$($asset.Suffix) in $releasePath; found $($files.Count)." }
            "$($asset.Output)=$($files[0].FullName)" | Add-Content -Path $env:GITHUB_OUTPUT
          }

      - name: Launch-smoke runtime-required asset
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use_manual_launch_smoke_proof) }}
        shell: pwsh
        env:
          SBE_RUN_UI_TESTS: "true"
          SBE_APP_EXE: ${{ steps.publish.outputs.runtime_required_asset }}
        run: .\scripts\Invoke-UiSmoke.ps1 -NoBuild -TimeoutSeconds 90

      - name: Launch-smoke portable asset
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use_manual_launch_smoke_proof) }}
        shell: pwsh
        env:
          SBE_RUN_UI_TESTS: "true"
          SBE_APP_EXE: ${{ steps.publish.outputs.portable_asset }}
        run: .\scripts\Invoke-UiSmoke.ps1 -NoBuild -TimeoutSeconds 90

      - name: Record interactive launch-smoke gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_manual_launch_smoke_proof }}
        shell: pwsh
        env:
          MANUAL_PROOF_REFERENCE: ${{ inputs.manual_launch_smoke_proof_reference }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANUAL_PROOF_REFERENCE)) {
            throw 'A manual launch-smoke proof reference is required when hosted launch smoke is skipped.'
          }

          $runtimeRequiredHash = (Get-FileHash -LiteralPath '${{ steps.publish.outputs.runtime_required_asset }}' -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash -LiteralPath '${{ steps.publish.outputs.portable_asset }}' -Algorithm SHA256).Hash
          Write-Host "Hosted launch smoke is skipped only because a maintainer explicitly confirmed the documented interactive proof for both final assets."
          Write-Host "This run remains draft-only and must still complete every other validation gate."
          # A doubled backtick writes one Markdown backtick; a single one would escape the next character.
          @"
          ## Interactive launch-smoke gate

          - Tag: ``${{ needs.build.outputs.tag }}``
          - Proof reference: ``$env:MANUAL_PROOF_REFERENCE``
          - Runtime-required SHA-256: ``$runtimeRequiredHash``
          - Portable SHA-256: ``$portableHash``
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $runtimeRequiredAsset = '${{ steps.publish.outputs.runtime_required_asset }}'
          $portableAsset = '${{ steps.publish.outputs.portable_asset }}'
          $runtimeRequiredName = Split-Path -Leaf $runtimeRequiredAsset
          $portableName = Split-Path -Leaf $portableAsset
          $targetCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($targetCommit)) {
            throw "Could not determine the checked-out tag commit for '$env:TAG'."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$env:TAG.md"

          $notes = @"
          ## Choose a download

          ### Portable — recommended if you are unsure

          ``$portableName``

          - Includes the .NET runtime.
          - No separate .NET installation is required.
          - Larger download.

          ### Smaller download — .NET 10 required

          ``$runtimeRequiredName``

          - Requires the [.NET 10 Desktop Runtime for Windows x64](https://dotnet.microsoft.com/en-us/download/dotnet/10.0/runtime).
          - If the application reports a missing framework, install the Desktop Runtime and retry.

          ## Windows security notice

          Both executables are signed by **Open Source Developer Krzysztof Kołodziejczak** (certificate issued by Certum). To check, right-click the file, choose Properties > Digital Signatures, and confirm that name. Windows Defender SmartScreen may still show an unrecognized-app warning while the certificate builds download reputation. Download releases only from this repository and verify that the tag and release correspond to the version you intended to install.
          "@
          Set-Content -LiteralPath $notesPath -Value $notes -NoNewline

          function Remove-DraftRelease {
            param([Parameter(Mandatory = $true)][string]$FailureMessage)

            gh release delete $env:TAG --yes
            if ($LASTEXITCODE -ne 0) {
              throw "$FailureMessage Draft cleanup for '$env:TAG' also failed."
            }
          }

          $generatedNotes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:TAG" -f "target_commitish=$targetCommit" --jq .body
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($generatedNotes)) {
            Add-Content -LiteralPath $notesPath -Value "`n`n## Changes`n`n$generatedNotes"
          }

          $release = gh release view $env:TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseInfo = $release | ConvertFrom-Json
            if (-not $releaseInfo.isDraft) {
              throw "Release '$env:TAG' is already published. This workflow refuses to overwrite published releases."
            }

            foreach ($asset in $releaseInfo.assets) {
              gh release delete-asset $env:TAG $asset.name --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove existing draft asset '$($asset.name)' from '$env:TAG'."
              }
            }

            gh release edit $env:TAG --draft --title "Service Bus Emulator Explorer $env:TAG" --notes-file $notesPath
          }
          else {
            gh release create $env:TAG --draft --title "Service Bus Emulator Explorer $env:TAG" --notes-file $notesPath
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update draft release '$env:TAG'."
          }

          foreach ($assetPath in @($runtimeRequiredAsset, $portableAsset)) {
            $assetName = Split-Path -Leaf $assetPath
            gh release upload $env:TAG $assetPath
            if ($LASTEXITCODE -ne 0) {
              $failureMessage = "Could not upload release asset '$assetName' for '$env:TAG'."
              Remove-DraftRelease -FailureMessage $failureMessage
              throw $failureMessage
            }
          }

          $releaseView = gh release view $env:TAG --json assets
          if ($LASTEXITCODE -ne 0) {
            $failureMessage = "Could not inspect uploaded assets for draft release '$env:TAG'."
            Remove-DraftRelease -FailureMessage $failureMessage
            throw $failureMessage
          }

          $uploadedAssets = ($releaseView | ConvertFrom-Json).assets
          $uploadedNames = @($uploadedAssets.name | Sort-Object)
          $expectedNames = @($runtimeRequiredName, $portableName) | Sort-Object
          if ($uploadedNames.Count -ne 2 -or (Compare-Object $uploadedNames $expectedNames)) {
            $failureMessage = "Draft release '$env:TAG' does not contain exactly the two expected executable assets."
            Remove-DraftRelease -FailureMessage $failureMessage
            throw $failureMessage
          }
