name: Feature request
description: Propose a focused improvement or new workflow.
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
        - label: This request contains no credentials, private message content, customer data, or other sensitive information.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other designs you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connection and authentication
        - Namespace and entity management
        - Message inspection
        - Send, replay, or DLQ operations
        - Desktop UI and accessibility
        - Testing, packaging, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized mockups, examples, or constraints that clarify the proposal.
