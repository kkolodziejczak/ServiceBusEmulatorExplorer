name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed connection strings, keys, tokens, profile data, real message content, and other sensitive information.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v0.1.3 or abc1234
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Portable release
        - Runtime-required release
        - Source build
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target and authentication
      options:
        - Local emulator with connection strings
        - Azure namespace with connection strings
        - Azure namespace with Azure CLI / RBAC
        - Not connection-related
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence and sanitized sample data when useful.
      placeholder: |
        1. Connect to ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Paste operation-log or exception text and attach screenshots only after removing sensitive data.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Note whether the issue is consistent, intermittent, or began after an upgrade.
